<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caddie</title>
<style>
/* Caddie : instrument de mesure, a la maniere d'une montre de golf.
   Neutre (blanc, gris, noir pur), un seul accent bleu pour "toi" et les selections,
   le vert reserve au dessin du trou. Chiffres en Barlow Condensed, tres grands. */
:root{
  --bg:#f2f3f5;--card:#fff;--soft:#f2f3f5;--ink:#000;--ink2:#2b2f36;--mute:#676d76;--line:#e1e3e7;
  --acc:#0a66e8;--flag:#e2312b;--ok:#17803f;--bad:#d2302a;--warnbg:#fff4d4;--warnink:#563f00;
  --btn:#000;--btnink:#fff;--shadow:0 1px 2px #0000000f;
  --sv-rough:#e7ece4;--sv-fw:#b4d0a3;--sv-green:#84c071;--sv-tee:#c6dcbb;--sv-bunker:#eee0b5;--sv-water:#9ccbeb;--sv-text:#000;--sv-halo:#fff;
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#141518;--soft:#1d1f23;--ink:#fff;--ink2:#d9dce1;--mute:#8e949d;--line:#27292e;
  --acc:#3d8bff;--warnbg:#2c240e;--warnink:#ffe19d;--btn:#fff;--btnink:#000;--shadow:none;
  --sv-rough:#171b18;--sv-fw:#365f32;--sv-green:#56a046;--sv-tee:#2a4527;--sv-bunker:#b9a97e;--sv-water:#2b6a98;--sv-text:#fff;--sv-halo:#000;
  color-scheme:dark;
}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:underline;text-underline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;min-height:54px}
header h1{font:600 20px/1.1 var(--num);letter-spacing:.2px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:var(--ink);font-size:30px;line-height:1;width:44px;height:44px;visibility:hidden}
#gpsdot{display:flex;align-items:center;gap:6px;font:600 14px var(--num);color:var(--mute);font-variant-numeric:tabular-nums}
#gpsdot i{width:9px;height:9px;border-radius:50%;background:#9aa0a8;display:inline-block}
main{max-width:640px;margin:0 auto;padding:12px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{position:relative;background:none;border:0;color:var(--mute);padding:9px 0 10px;font:500 13px Barlow,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button.on{color:var(--ink);font-weight:700}
nav#tabs button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.hero{border-color:var(--ink);border-width:1.5px}
h2{font:700 30px/1.05 var(--num);margin:0 0 6px;letter-spacing:.2px}
h3{font:600 17px/1.2 Barlow,system-ui,sans-serif;margin:0 0 10px}
.k{font-size:14px;color:var(--mute);margin:0 0 2px}
p{margin:0 0 10px}
small,.mute{color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:600 17px Barlow,system-ui,sans-serif;cursor:pointer;line-height:1.1;text-align:center}
.btn.y{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.btn.ghost{border-color:var(--line);background:var(--card)}
.btn.red{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.big{min-height:60px;font-size:19px;width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35}
.btn:active,.clubs button:active,.stepper button:active,.nav:active{transform:scale(.98)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--mute)}
label.f input,label.f select{display:block;width:100%;margin-top:4px}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;min-height:46px}
input:focus,select:focus{border-color:var(--ink);outline:none}
button:focus-visible,a:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.list a,.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.list a:last-child,.item:last-child{border-bottom:0}
.list a b,.item b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);font:500 15px Barlow,system-ui,sans-serif;background:var(--card);color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0004;flex:none}
.badge{font:600 12px Barlow,system-ui,sans-serif;background:var(--acc);color:#fff;border-radius:6px;padding:1px 7px}
/* ecran de jeu */
.holebar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:6px;margin:0 0 10px}
.holebar .nav{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:30px;height:52px;border-radius:12px}
.holebar .nav:disabled{opacity:.3}
.hn{font:700 34px/1 var(--num);text-align:center}
.hstats{display:flex;justify-content:center;gap:18px;margin:4px 0 0}
.hstats div{display:flex;align-items:baseline;gap:5px}
.hstats dt{font-size:14px;color:var(--mute)}
.hstats dd{margin:0;font:600 20px/1 var(--num);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.live{padding:6px 16px 14px}
.dist{display:grid;grid-template-columns:1fr;justify-items:center;text-align:center}
.fbk{display:flex;align-items:baseline;gap:8px;font:600 26px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--ink2);padding:6px 0}
.fbk span{font:500 15px Barlow,system-ui,sans-serif;color:var(--mute);width:44px;text-align:right}
.fbk span+b{min-width:44px;text-align:left}
.mid{display:flex;flex-direction:column;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);width:100%;padding:2px 0 8px}
.bigd{font:700 clamp(104px,34vw,150px)/.9 var(--num);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.mid span{font-size:15px;color:var(--mute)}
.far{text-align:center;padding:18px 0 10px}
.far b{display:block;font:700 58px/1 var(--num)}
.far span{color:var(--mute);font-size:15px}
.wait{text-align:center;padding:26px 0;color:var(--mute)}
.advrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:12px;font-size:15px;color:var(--mute)}
.advrow b{color:var(--ink);font:600 22px/1 var(--num);margin-left:6px}
.clubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.clubs button{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px/1.1 Barlow,system-ui,sans-serif;padding:4px}
.clubs button small{display:block;font:500 15px var(--num);color:var(--mute);margin-top:2px}
.clubs button.rec{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.clubs button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.clubs button.on small{color:var(--card);opacity:.75}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:12px}
.actions .btn{min-height:64px}
.actions .btn small{display:block;font-weight:500;font-size:14px;opacity:.75}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);min-height:40px;border-radius:9px;font:600 15px Barlow,system-ui,sans-serif}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.fig{position:relative;width:100%;aspect-ratio:34/44;border-radius:12px;overflow:hidden;background:var(--sv-rough)}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig .rough{fill:var(--sv-rough)}.fig .fairway{fill:var(--sv-fw)}.fig .green{fill:var(--sv-green)}.fig .tee{fill:var(--sv-tee)}.fig .bunker{fill:var(--sv-bunker)}.fig .water{fill:var(--sv-water)}
.fig .lbl{fill:var(--sv-text);stroke:var(--sv-halo);stroke-width:3.5px;paint-order:stroke;font-family:var(--num);font-weight:700}
.fig .lbl.soft{fill:var(--mute);stroke:none;font-family:Barlow,system-ui,sans-serif;font-weight:500}
.fig .shot{stroke:var(--sv-text)}
.fig .aim{stroke:var(--sv-text);stroke-opacity:.35}
.photo{position:relative}
.photo img{display:block;width:100%;border-radius:12px}
.photo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.prow{display:grid;grid-template-columns:1fr auto 56px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pn{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pn small{font-weight:400;width:100%}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:600}
.stepper b{min-width:36px;text-align:center;font:700 30px/1 var(--num);font-variant-numeric:tabular-nums}
.pts{text-align:right;font-size:13px;color:var(--mute)}
.pts b{display:block;font:700 24px/1 var(--num);color:var(--ink)}
.putt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);grid-column:1/-1}
.putt .stepper button{width:44px;height:44px;font-size:20px}
.putt .stepper b{font-size:24px}
/* tableaux */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:500}
td.l,th.l{text-align:left}
td input{width:54px;min-height:40px;padding:6px;text-align:center}
.under{color:var(--ok);font-weight:700}.over2{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:12px;font-size:15px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-size:16px;opacity:0;transition:.2s;z-index:50;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;background:#0009;z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#toast{transition:none}.btn:active,.clubs button:active{transform:none}}
input[type=file]{display:none}
/* Version test : badge Netlify (plan gratuit) masque, il couvrait la barre d onglets. A retirer en changeant d hebergeur ou de plan. */
#nl-badge-frame{display:none!important}
</style>
</head>
<body>
<header><button id="back" onclick="G.back()" aria-label="Retour">&#8249;</button><h1 id="title">Caddie</h1><span id="gpsdot"><i></i><span></span></span></header>
<main id="app"><p class="mute">Chargement...</p></main>
<nav id="tabs">
  <button data-t="home" onclick="G.tab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21V3l10 4-10 4"/><ellipse cx="12" cy="20" rx="8" ry="2"/></svg>Partie</button>
  <button data-t="courses" onclick="G.tab('courses')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Parcours</button>
  <button data-t="history" onclick="G.tab('history')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Parties</button>
  <button data-t="profile" onclick="G.tab('profile')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)G.closeModal()"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fCard" accept="image/*" multiple onchange="G.cardFiles(this)">
<input type="file" id="fHole" accept="image/*" capture="environment" onchange="G.holePhoto(this)">
<input type="file" id="fImport" accept="application/json,.json" onchange="G.importData(this)">

<script>
{
'use strict';
/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const rad = d => d * Math.PI / 180;
function hav(a, b) {
  if (!a || !b) return null;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const std = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const num = (v, d = null) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const fmtDate = iso => new Date(iso).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const signed = n => n > 0 ? '+' + n : (n === 0 ? 'Par' : String(n));
const pt = p => p ? {lat: +p.lat.toFixed(7), lng: +p.lng.toFixed(7)} : null;

const TEE = {Noir:'#111111', Blanc:'#f4f4f4', Jaune:'#f2c200', Bleu:'#1f6fd1', Rouge:'#d0312d', Orange:'#f08a24', Vert:'#2e9b4f', Violet:'#7a3fbf'};
const TEE_EN = {black:'Noir', white:'Blanc', yellow:'Jaune', blue:'Bleu', red:'Rouge', orange:'Orange', green:'Vert', purple:'Violet', violet:'Violet'};
const teeHex = c => TEE[c] || '#999';
const DEFAULT_CLUBS = [['Driver',220],['Bois 3',200],['Hybride',185],['Fer 5',170],['Fer 6',160],['Fer 7',150],['Fer 8',140],['Fer 9',128],['PW',115],['GW',100],['SW',85],['LW',65],['Putter',0]];
const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const CATALOG = 'golfs-gironde.json'; // parcours prepares a partir d'OpenStreetMap, servis avec l'app
const OSM_CREDIT = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">contributeurs OpenStreetMap</a>';

/* ---------- stockage local (IndexedDB) ---------- */
const Store = {
  db: null, mem: {},
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('caddie', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  },
  get(k) {
    if (!this.db) return Promise.resolve(this.mem[k]);
    return new Promise(res => { try { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); } catch (e) { res(undefined); } });
  },
  set(k, v) {
    if (!this.db) { this.mem[k] = v; return Promise.resolve(); }
    return new Promise(res => { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  },
  del(k) {
    if (!this.db) { delete this.mem[k]; return Promise.resolve(); }
    return new Promise(res => { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  }
};

/* ---------- etat ---------- */
const S = {profile: null, guests: [], courses: [], rounds: [], view: 'home', params: {}, stack: [], setup: null, calib: null, sim: false, photoCache: {}};
const save = {
  profile: () => Store.set('profile', S.profile), guests: () => Store.set('guests', S.guests),
  courses: () => Store.set('courses', S.courses), rounds: () => Store.set('rounds', S.rounds)
};
const defaultProfile = () => ({name: 'Moi', index: 36, sex: 'H', tee: 'Jaune', clubs: DEFAULT_CLUBS.map(([n, d]) => ({id: uid(), name: n, dist: d})), apiKey: '', model: 'claude-sonnet-5-5'});
const course = id => S.courses.find(c => c.id === id);
const liveRound = () => S.rounds.find(r => r.status === 'live');
const clubById = id => S.profile.clubs.find(c => c.id === id);

/* ---------- GPS ---------- */
const GPS = {
  pos: null, watch: null, err: null,
  start() {
    if (this.watch != null || !navigator.geolocation) { if (!navigator.geolocation) this.err = 'GPS indisponible'; return; }
    this.watch = navigator.geolocation.watchPosition(p => {
      if (S.sim) return;
      this.err = null;
      this.pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now()};
      onGps();
    }, e => { this.err = e.code === 1 ? 'Autorise la localisation' : 'Signal GPS faible'; onGps(); }, {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
  }
};
function fix() {
  return new Promise((res, rej) => {
    if (GPS.pos && (S.sim || Date.now() - GPS.pos.t < 4000)) return res({...GPS.pos});
    if (!navigator.geolocation) return rej(new Error('GPS indisponible'));
    navigator.geolocation.getCurrentPosition(
      p => { GPS.pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now()}; res({...GPS.pos}); },
      () => (GPS.pos && Date.now() - GPS.pos.t < 60000) ? res({...GPS.pos}) : rej(new Error('Position GPS introuvable')), {enableHighAccuracy: true, timeout: 15000, maximumAge: 3000});
  });
}
function gpsBadge() {
  const i = $('#gpsdot i'), t = $('#gpsdot span');
  if (S.sim) { i.style.background = '#b07cff'; t.textContent = 'Simu'; return; }

/* ---------- calculs golf ---------- */
function holeRanks(c) {
  const idx = c.holes.map((h, i) => ({i, h: h.hcp || (i + 1)}));
  idx.sort((a, b) => a.h - b.h || a.i - b.i);
  const rank = Array(c.holes.length); idx.forEach((o, k) => rank[o.i] = k + 1); return rank;
}
function strokesOn(ph, rank, n) {
  if (ph >= 0) return Math.floor(ph / n) + (rank <= ph % n ? 1 : 0);
  const a = -ph; return -(Math.floor(a / n) + (rank > n - (a % n) ? 1 : 0));
}
const coursePar = c => c.holes.reduce((s, h) => s + (h.par || 0), 0);
const teeOf = (c, color) => c.tees.find(t => t.color === color) || c.tees[0];
function playingHcp(index, c, color) {
  const t = teeOf(c, color) || {};
  const par = t.par || coursePar(c), sss = t.sss || par, slope = t.slope || 113;
  let idx = num(index, 54); if (c.holes.length === 9) idx = idx / 2;
  return Math.round(idx * slope / 113 + (sss - par));
}
const teeLength = (c, color) => c.holes.reduce((s, h) => s + (num(h.dist && h.dist[color], 0)), 0);
function suggestTee(c, driver, sex) {
  if (!c.tees.length) return null;
  const withLen = c.tees.map(t => ({t, L: teeLength(c, t.color)})).filter(o => o.L > 0);
  if (driver && withLen.length) {
    const target = driver * (c.holes.length === 9 ? 14 : 28); // regle "tee it forward"
    return withLen.sort((a, b) => Math.abs(a.L - target) - Math.abs(b.L - target))[0].t.color;
  }
  const pref = sex === 'F' ? 'Rouge' : 'Jaune';
  return (c.tees.find(t => t.color === pref) || c.tees[0]).color;
}
function totals(c, p) {
  const ranks = holeRanks(c), n = c.holes.length;
  const o = {brut: 0, par: 0, net: 0, sn: 0, sb: 0, played: 0, putts: 0, out: 0, inn: 0};
  c.holes.forEach((h, i) => {
    const s = p.scores[i], rec = strokesOn(p.ph, ranks[i], n);
    if (s != null) {
      o.brut += s; o.par += h.par; o.net += s - rec; o.played++;
      o.sb += Math.max(0, h.par + 2 - s); o.sn += Math.max(0, h.par + rec + 2 - s);
      if (i < 9) o.out += s; else o.inn += s;
    }
    if (p.putts && p.putts[i] != null) o.putts += p.putts[i];
  });
  o.toPar = o.brut - o.par; o.netToPar = o.net - o.par; return o;
}
function holePoints(c, p, i, ranks) {
  const s = p.scores[i]; if (s == null) return null;
  const rec = strokesOn(p.ph, ranks[i], c.holes.length);
  return Math.max(0, c.holes[i].par + rec + 2 - s);
}
function matchPlay(c, a, b) {
  const ranks = holeRanks(c), n = c.holes.length, diff = b.ph - a.ph;
  let st = 0, played = 0;
  c.holes.forEach((h, i) => {
    const sa = a.scores[i], sb = b.scores[i]; if (sa == null || sb == null) return;
    played++;
    const give = Math.abs(diff), extra = Math.floor(give / n) + (ranks[i] <= give % n ? 1 : 0);
    const na = sa - (diff < 0 ? extra : 0), nb = sb - (diff > 0 ? extra : 0);
    if (na < nb) st++; else if (nb < na) st--;
  });
  if (!played) return null;
  const left = c.holes.length - played;
  if (st === 0) return 'All square' + (left ? ' (' + played + ' trou' + (played > 1 ? 's' : '') + ')' : '');
  const lead = st > 0 ? a.name : b.name, up = Math.abs(st);
  if (left && up > left) return lead + ' gagne ' + up + '&' + left;
  return lead + ' ' + up + ' UP' + (left ? ' (' + played + ' trou' + (played > 1 ? 's' : '') + ')' : '');
}
function recommend(rem) {
  const cl = S.profile.clubs.filter(c => c.dist > 0).sort((a, b) => b.dist - a.dist);
  if (rem == null || !cl.length) return null;
  if (rem < 25) return S.profile.clubs.find(c => c.dist === 0) || cl[cl.length - 1];
  if (rem >= cl[0].dist) return cl[0];
  return cl.reduce((best, c) => Math.abs(c.dist - rem) < Math.abs(best.dist - rem) ? c : best, cl[0]);
}
function clubStats(rounds) {
  const map = {};
  for (const r of rounds) for (const st of (r.holes || [])) for (const s of (st.shots || [])) {
    const club = clubById(s.club);
    const key = club ? club.id : 'n:' + s.cn;
    const ref = club ? club.dist : 0;
    if (!s.dist || (club && club.dist === 0)) continue;
    const m = map[key] || (map[key] = {id: key, name: club ? club.name : s.cn, ref, full: [], partial: 0});
    const full = s.remBefore == null || !ref || s.remBefore >= ref * 0.9;
    if (full) m.full.push(s.dist); else m.partial++;
  }
  return Object.values(map).sort((a, b) => b.ref - a.ref).map(m => ({...m, avg: mean(m.full), med: median(m.full), sd: std(m.full), max: m.full.length ? Math.max(...m.full) : null}));
}
function advice(stats, rounds) {
  const out = [];
  for (const s of stats) {
    if (s.full.length < 2 || !s.ref) continue;
    const gap = (s.med - s.ref) / s.ref;
    if (gap < -0.08) out.push(['work', s.name + ' : ' + Math.round(s.ref - s.med) + ' m plus court que ton etalonnage. A travailler (contact, vitesse), ou etalonnage trop optimiste.']);
    else if (gap > 0.08) out.push(['info', s.name + ' : ' + Math.round(s.med - s.ref) + ' m plus long que prevu. Pense a mettre a jour l\'etalonnage.']);
    if (s.avg && s.sd / s.avg > 0.12 && s.full.length >= 3) out.push(['work', s.name + ' : distances irregulieres (±' + Math.round(s.sd) + ' m). Travailler la regularite.']);
  }
  let putts = [], holes = 0;
  for (const r of rounds) { const p = r.players[0]; (p.putts || []).forEach(v => { if (v != null) { putts.push(v); holes++; } }); }
  if (holes >= 6) { const a = mean(putts); if (a > 2) out.push(['work', 'Putting : ' + a.toFixed(1) + ' putts par trou en moyenne. Le petit jeu est la priorite.']); }
  return out.map(([k, t]) => [k, t.replace(/etalonnage/g, 'étalonnage').replace(/A travailler/g, 'À travailler').replace(/prevu/g, 'prévu').replace(/irregulieres/g, 'irrégulières').replace(/regularite/g, 'régularité').replace(/priorite/g, 'priorité')]);
}

/* ---------- partie ---------- */
let wakeLock = null;
async function wake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.view === 'play') wake(); });

function ctx() {
  const r = liveRound(); if (!r) return null;
  const c = course(r.courseId), i = r.hole, h = c.holes[i], st = r.holes[i], me = r.players[0];
  const last = st.shots.length ? st.shots[st.shots.length - 1].to : st.start;
  return {r, c, i, h, st, me, last, cur: GPS.pos, tee: h.tee || st.start, green: h.green, len: num(h.dist && h.dist[me.tee])};
}
function greenPoly(x) {
  if (!x.green || !x.c.osm) return null;
  let best = null, bd = 45;
  for (const f of x.c.osm.features) if (f.t === 'green') {
    const cen = {lat: mean(f.p.map(p => p[0])), lng: mean(f.p.map(p => p[1]))}, d = hav(cen, x.green);
    if (d < bd) { bd = d; best = f; }
  }
  return best ? best.p.map(p => ({lat: p[0], lng: p[1]})) : null;
}
function remaining(x, from) {
  from = from || x.cur;
  if (x.green && from) {
    const d = hav(from, x.green), poly = greenPoly(x);
    let front = null, back = null;
    if (poly) { const ds = poly.map(p => hav(from, p)); front = Math.min(...ds); back = Math.max(...ds); }
    return {d, front, back, est: false};
  }
  if (x.len) {
    if (from && x.tee) return {d: Math.max(0, x.len - hav(x.tee, from)), est: true};
    if (!x.st.shots.length) return {d: x.len, est: true};
  }
  return null;
}
V.play = () => {

    <div><div class="hn">Trou ${x.i + 1}</div><dl class="hstats"><div><dt>Par</dt><dd>${h.par || '-'}</dd></div><div><dt>HCP</dt><dd>${h.hcp || '-'}</dd></div>${x.len ? `<div><dt><span class="dot" style="background:${teeHex(me.tee)}" title="Départ ${esc(me.tee)}"></span></dt><dd>${x.len} m</dd></div>` : ''}</dl></div>

};

// a plus de 1,5 km du trou, on n'est pas en train de le jouer : pas de distance ni de conseil
const FAR = 1500;
function farFrom(x) {
  const ref = x.green || x.tee;
  if (!x.cur || !ref) return null;
  const d = hav(x.cur, ref); return d > FAR ? d : null;
}
function remNow(x) { return farFrom(x) ? null : remaining(x); }
function renderLive() {
  const el = $('#live'), x = ctx(); if (!el || !x) return;
  const far = farFrom(x), rem = remNow(x);
  let h = '';
  if (far) {
    h = `<div class="far"><b>${far < 10000 ? (far / 1000).toFixed(1).replace('.', ',') : Math.round(far / 1000)} km</b><span>Hors du parcours. Les distances s'affichent quand tu es sur le trou ${x.i + 1}.</span></div>`;
  } else if (rem) {
    const fb = (label, v) => `<div class="fbk"><span>${label}</span><b>${Math.round(v)}</b></div>`;
    h = '<div class="dist">' + (rem.back != null ? fb('Fond', rem.back) : '')
      + `<div class="mid"><b class="bigd">${Math.round(rem.d)}</b><span>${rem.est ? 'mètres, estimé (green non positionné)' : 'mètres au centre du green'}</span></div>`
      + (rem.front != null ? fb('Avant', rem.front) : '') + '</div>';
    const rc = recommend(rem.d);
    const last = x.last && x.cur ? `<span>Dernier point<b>${Math.round(hav(x.last, x.cur))} m</b></span>` : '<span></span>';
    if (rc) h += `<div class="advrow"><span>Conseil<b>${esc(rc.name)}</b></span>${last}</div>`;
  } else h = `<div class="wait">${x.cur ? 'Distance inconnue : renseigne la longueur du trou ou place le green.' : esc(GPS.err || 'Recherche du signal GPS...')}</div>`;
  el.innerHTML = h;
}
function renderActions() {
  const el = $('#actions'), x = ctx(); if (!el || !x) return;
  const n = x.st.shots.length;
  const main = (!x.st.start && !n)

    h += `<tr><td class="l"><b>${esc(s.name)}</b><div class="bar" style="width:120px;margin-top:4px"><i style="width:${(s.med || 0) / maxD * 100}%"></i></div></td><td>${s.ref || '-'}</td><td>${s.avg != null ? Math.round(s.avg) : '-'}</td><td>${s.med != null ? Math.round(s.med) : '-'}</td><td class="${gap == null ? '' : gap < -8 ? 'over2' : gap > 8 ? 'under' : ''}">${gap == null ? '-' : (gap > 0 ? '+' : '') + gap}</td><td>${s.full.length}${s.partial ? ' <small>(+' + s.partial + ')</small>' : ''}</td></tr>`;
  }
  h += `</tbody></table></div><p class="mute" style="margin-top:6px">Entre parenthèses : coups partiels (green plus proche que la distance du club), exclus des moyennes.</p>`;
  const adv = advice(st, rounds);
  if (adv.length) h += `<h3 style="margin-top:12px">À travailler</h3>` + adv.map(([k, t]) => `<p style="font-size:15px">${k === 'work' ? '●' : '○'} ${esc(t)}</p>`).join('');
  else if (st.some(s => s.full.length >= 2)) h += `<p style="margin-top:10px">Tes distances collent à ton étalonnage. Rien de flagrant à corriger sur ces coups.</p>`;
  else h += `<p class="mute" style="margin-top:10px">Pas encore assez de coups pleins par club pour conclure (2 minimum par club).</p>`;
  return h + `</section>`;
}

    st.forEach(s => l3([s.name, s.ref || '-', s.avg != null ? Math.round(s.avg) : '-', s.med != null ? Math.round(s.med) : '-', s.med != null && s.ref ? (s.med - s.ref > 0 ? '+' : '') + Math.round(s.med - s.ref) : '-', s.full.length]));

  }
  doc.setFontSize(8); doc.setTextColor(140); doc.text('Caddie · carte générée le ' + new Date().toLocaleString('fr-FR'), x0, 205);
  const safe = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_');

async function overpass(q) {
  let err;
  for (const u of OVERPASS) {
    try {
      const r = await fetch(u, {method: 'POST', body: 'data=' + encodeURIComponent(q), headers: {'Content-Type': 'application/x-www-form-urlencoded'}});
      if (r.ok) return await r.json(); err = new Error('Serveur OSM occupé (' + r.status + ')');
    } catch (e) { err = new Error('Pas de connexion au serveur OSM'); }
  }
  throw err;
}

async function importOsm(c) {
  const ce = c.center || (c.lat ? {lat: c.lat, lng: c.lng} : null) || GPS.pos;
  if (!ce) throw new Error('position du golf inconnue');
  const j = await overpass(`[out:json][timeout:60];(way["golf"](around:2200,${ce.lat},${ce.lng});way["natural"="water"](around:2200,${ce.lat},${ce.lng}););out geom;`);
  const ways = j.elements.filter(e => e.type === 'way' && e.geometry && e.geometry.length > 1);
  const simp = g => { const step = Math.max(1, Math.ceil(g.length / 60)); return g.filter((_, i) => i % step === 0 || i === g.length - 1).map(q => [+q.lat.toFixed(6), +q.lon.toFixed(6)]); };
  const features = [];
  for (const w of ways) {
    const t = w.tags || {}, gt = t.golf;
    let type = null;
    if (gt === 'green' || gt === 'fairway' || gt === 'bunker' || gt === 'tee' || gt === 'rough') type = gt;
    else if (gt === 'water_hazard' || gt === 'lateral_water_hazard' || t.natural === 'water') type = 'water';
    if (type) features.push({t: type, p: simp(w.geometry)});
  }
  // numero du trou : "5", "Trou 5" ou "18 trous - 5" (Gujan) ; le prefixe sert de nom de parcours
  const refNum = s => { const m = String(s || '').match(/(\d+)\s*$/); return m ? +m[1] : 0; };
  const refGroup = s => { const m = String(s || '').match(/^(.*?)[\s\-:]+\d+\s*$/); return m ? m[1].trim() : ''; };
  let holes = ways.filter(w => w.tags && w.tags.golf === 'hole' && refNum(w.tags.ref) > 0);
  const groupKey = w => w.tags['golf:course:name'] || w.tags['golf:course'] || refGroup(w.tags.ref);
  const refs = holes.map(w => refNum(w.tags.ref));
  if (new Set(refs).size < refs.length) {
    // plusieurs parcours sur le site : on garde le groupe dont le nom colle, sinon les trous les plus proches
    const groups = {}; holes.forEach(w => (groups[groupKey(w)] = groups[groupKey(w)] || []).push(w));
    const names = Object.keys(groups).filter(Boolean);
    const match = names.find(n => c.name.toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(c.name.toLowerCase()));
    if (match) holes = groups[match];
    else if (names.length > 1) holes = groups[names.sort((a, b) => groups[b].length - groups[a].length)[0]]; // le plus grand parcours du site
    else {
      const best = {};
      holes.forEach(w => { const r = refNum(w.tags.ref), d = hav({lat: w.geometry[0].lat, lng: w.geometry[0].lon}, ce); if (!best[r] || d < best[r].d) best[r] = {w, d}; });
      holes = Object.values(best).map(o => o.w);
    }
  }
  c.osm = {features, date: new Date().toISOString()};
  if (!holes.length) return `Aucun trou tracé sur OpenStreetMap pour ce golf (${features.filter(f => f.t === 'green').length} greens dessinés). Les positions se rempliront pendant tes parties.`;
  const n = Math.min(18, Math.max(...holes.map(w => refNum(w.tags.ref))));
  const N = n <= 9 ? 9 : 18;
  if (c.holes.length !== N) { const old = c.holes; c.holes = blankHoles(N).map((h, i) => old[i] ? {...old[i], n: i + 1} : h); }
  const greens = features.filter(f => f.t === 'green').map(f => ({lat: mean(f.p.map(p => p[0])), lng: mean(f.p.map(p => p[1]))}));
  const toGreen = q => Math.min(...greens.map(gc => hav({lat: q.lat, lng: q.lon}, gc)));
  let cnt = 0;
  for (const w of holes) {
    const k = refNum(w.tags.ref) - 1; if (k >= N) continue;
    let g = w.geometry;
    // le trace va normalement du depart au green ; on le retourne s'il a ete dessine a l'envers
    if (greens.length >= holes.length / 2 && toGreen(g[0]) + 5 < toGreen(g[g.length - 1])) g = g.slice().reverse();
    const h = c.holes[k];
    h.tee = {lat: g[0].lat, lng: g[0].lon}; h.green = {lat: g[g.length - 1].lat, lng: g[g.length - 1].lon};
    if (w.tags.par) h.par = parseInt(w.tags.par) || h.par;
    if (w.tags.handicap) h.hcp = parseInt(w.tags.handicap) || h.hcp;
    let L = 0; for (let i = 1; i < g.length; i++) L += hav({lat: g[i - 1].lat, lng: g[i - 1].lon}, {lat: g[i].lat, lng: g[i].lon});
    h.osmLen = Math.round(L);
    for (const t of c.tees) if (!num(h.dist[t.color])) h.dist[t.color] = h.osmLen;
    cnt++;
  }
  const par = coursePar(c); c.tees.forEach(t => { if (!t.par || t.par === 72) t.par = par; if (!t.sss || t.sss === 72) t.sss = par; });
  if (c.holes[0].tee && !c.lat) { c.lat = c.holes[0].tee.lat; c.lng = c.holes[0].tee.lng; }
  return `${cnt} trous importés avec départ et green GPS. Distances provisoires mesurées sur la carte : photographie la carte de score pour les vraies valeurs.`;
}

    <p class="mute" style="margin:0">${c.lat ? 'Repère GPS enregistré : le parcours sera proposé automatiquement.' : 'Repère GPS enregistré au premier départ.'}</p></section>
  ${c.draft && (c.draft.parEst || c.draft.hcpMissing) ? `<div class="warn">Parcours importé d'OpenStreetMap : ${c.draft.parEst ? 'par estimé d\'après la longueur des trous, ' : ''}${c.draft.hcpMissing ? 'index des trous manquants, ' : ''}distances mesurées sur la carte (départ Jaune provisoire). Photographie la carte de score ou corrige à la main avant de jouer.</div>` : ''}
  <section class="card"><h3>Remplir automatiquement</h3><div class="grid2"><button class="btn y" onclick="G.cardStart('${id}')">Photo de la carte</button><button class="btn ghost" onclick="G.reOsm('${id}')">Import OSM</button></div>
    <p class="mute" style="margin:8px 0 0">Recto et verso possibles. Tu vérifies tout avant de jouer.</p></section>`;
  h += `<section class="card"><h3>Départs</h3><div class="scroll"><table><thead><tr><th class="l">Couleur</th><th>Slope</th><th>SSS</th><th>Par</th><th></th></tr></thead><tbody>${c.tees.map((t, k) => `<tr>
    <td class="l"><select onchange="G.tset('${id}',${k},'color',this.value)" style="min-height:38px;padding:6px">${Object.keys(TEE).map(col => `<option ${col === t.color ? 'selected' : ''}>${col}</option>`).join('')}</select></td>
    <td><input inputmode="numeric" value="${t.slope ?? ''}" onchange="G.tset('${id}',${k},'slope',this.value)"></td>
    <td><input inputmode="decimal" value="${t.sss ?? ''}" onchange="G.tset('${id}',${k},'sss',this.value)"></td>
    <td><input inputmode="numeric" value="${t.par ?? ''}" onchange="G.tset('${id}',${k},'par',this.value)"></td>
    <td><button class="btn sm ghost" onclick="G.trm('${id}',${k})" aria-label="Supprimer">×</button></td></tr>`).join('')}</tbody></table></div>
    <button class="btn sm ghost" style="margin-top:8px" onclick="G.tadd('${id}')">+ Ajouter un départ</button></section>`;
  h += `<section class="card"><h3>Trous</h3><div class="scroll"><table><thead><tr><th>N°</th><th>Par</th><th>HCP</th>${c.tees.map(t => `<th><span class="dot" style="background:${teeHex(t.color)}"></span></th>`).join('')}<th>GPS</th></tr></thead><tbody>${c.holes.map((ho, i) => `<tr><td><b>${i + 1}</b></td>
    <td><input inputmode="numeric" value="${ho.par ?? ''}" onchange="G.hset('${id}',${i},'par',this.value)" style="width:42px"></td>
    <td><input inputmode="numeric" value="${ho.hcp ?? ''}" onchange="G.hset('${id}',${i},'hcp',this.value)" style="width:42px"></td>
    ${c.tees.map(t => `<td><input inputmode="numeric" value="${ho.dist[t.color] ?? ''}" onchange="G.dset('${id}',${i},'${t.color}',this.value)" style="width:54px"></td>`).join('')}
    <td><small title="départ / green">${ho.tee ? 'D' : '·'}${ho.green ? 'G' : '·'}${ho.photo ? 'P' : ''}</small></td></tr>`).join('')}
    <tr><td><b>Tot</b></td><td><b>${coursePar(c)}</b></td><td></td>${c.tees.map(t => `<td><b>${teeLength(c, t.color) || ''}</b></td>`).join('')}<td></td></tr></tbody></table></div>
    <p class="mute" style="margin:8px 0 0">GPS : D départ, G green, P photo du trou. Les positions se complètent pendant tes parties.</p></section>
  <button class="btn red wide" style="margin-bottom:12px" onclick="G.delCourse('${id}')">Supprimer ce parcours</button>`;
  return h;
};
G.cset = (id, k, v) => { course(id)[k] = v.trim(); save.courses(); };
G.hset = (id, i, k, v) => { course(id).holes[i][k] = num(v); save.courses(); };
G.dset = (id, i, col, v) => { course(id).holes[i].dist[col] = num(v); save.courses(); };
G.tset = (id, k, f, v) => {
  const c = course(id), t = c.tees[k];
  if (f === 'color') { c.holes.forEach(h => { if (h.dist[t.color] != null) { h.dist[v] = h.dist[t.color]; delete h.dist[t.color]; } }); t.color = v; render(); }
  else t[f] = num(v);
  save.courses();
};
G.tadd = id => { const c = course(id), used = c.tees.map(t => t.color), col = Object.keys(TEE).find(k => !used.includes(k)) || 'Blanc'; c.tees.push({color: col, slope: 113, sss: coursePar(c), par: coursePar(c)}); save.courses(); render(); };
G.trm = (id, k) => { course(id).tees.splice(k, 1); save.courses(); render(); };
G.nholes = (id, v) => { const c = course(id), n = +v, old = c.holes; c.holes = blankHoles(n).map((h, i) => old[i] || h); save.courses(); render(); };
G.delCourse = async id => { if (!confirm('Supprimer ce parcours et ses photos ?')) return; const c = course(id); for (const h of c.holes) if (h.photo) await Store.del('ph:' + h.photo); S.courses = S.courses.filter(x => x.id !== id); await save.courses(); G.tab('courses'); };
G.reOsm = async id => {
  const c = course(id);
  if (!c.center && !c.lat) { try { const p = await fix(); c.center = {lat: p.lat, lng: p.lng}; } catch (e) { return toast('Position inconnue : va sur place ou utilise « Golfs autour de moi »'); } }
  toast('Import OSM en cours...');
  try { const m = await importOsm(c); await save.courses(); render(); toast(m, 5000); } catch (e) { toast('Import impossible : ' + e.message, 4000); }
};

/* ---------- lecture de la carte de score par IA ---------- */
let cardTarget = null;
G.cardStart = id => {
  if (!S.profile.apiKey) { modal(`<h3>Clé API nécessaire</h3><p>La lecture des cartes passe par l'API Claude (moins d'un centime par carte). Ajoute ta clé dans Profil &gt; Lecture des cartes.</p><button class="btn wide" onclick="G.closeModal();G.tab('profile')">Aller au profil</button>`); return; }
  cardTarget = id; $f('#fCard');
};
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q)); };
    img.onerror = () => rej(new Error('Image illisible')); img.src = url;
  });
}
const CARD_PROMPT = `Tu lis une carte de score de golf (une ou plusieurs photos : recto, verso). Extrait les donnees et reponds UNIQUEMENT avec un JSON valide, sans texte autour, de cette forme :
{"name": "nom du golf ou null", "holes": [{"n": 1, "par": 4, "hcp": 7, "dist": {"Blanc": 350, "Jaune": 330, "Rouge": 290}}], "tees": [{"color": "Jaune", "slope": 130, "sss": 71.2, "par": 72}]}
Regles : distances en metres (si la carte est en yards, convertis : yards x 0.9144, arrondi). Couleurs de depart en francais parmi : Noir, Blanc, Jaune, Bleu, Rouge, Orange, Vert, Violet. "hcp" est le handicap (index de difficulte) du trou. Si slope ou SSS existent par couleur (parfois homme et femme), mets les valeurs homme pour Blanc/Jaune et femme pour Bleu/Rouge. Une valeur illisible vaut null. Ne rien inventer.`;
G.cardFiles = async input => {
  const files = [...input.files]; input.value = ''; if (!files.length || !cardTarget) return;
  const c = course(cardTarget);
  modal(`<h3>Lecture de la carte...</h3><p class="mute">${files.length} photo${files.length > 1 ? 's' : ''} envoyée${files.length > 1 ? 's' : ''} à Claude. Compte 10 à 30 secondes.</p>`);
  try {
    const imgs = await Promise.all(files.map(f => resizeImage(f, 1600, 0.85)));
    const res = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST', headers: {'content-type': 'application/json', 'x-api-key': S.profile.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: S.profile.model || 'claude-sonnet-5-5', max_tokens: 4000, messages: [{role: 'user', content: [...imgs.map(d => ({type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: d.split(',')[1]}})), {type: 'text', text: CARD_PROMPT}]}]})});
    if (!res.ok) { const t = await res.text(); throw new Error(res.status === 401 ? 'Clé API refusée' : 'Erreur API ' + res.status + ' : ' + t.slice(0, 160)); }
    const j = await res.json(), txt = j.content.map(b => b.text || '').join(''), m = txt.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Réponse illisible');
    applyCard(c, JSON.parse(m[0]));
    await save.courses(); G.closeModal(); render();
    toast('Carte lue : vérifie les valeurs ci-dessous', 4500);
  } catch (e) { modal(`<h3>Lecture impossible</h3><p>${esc(e.message)}</p><button class="btn wide" onclick="G.closeModal()">OK</button>`); }
};
function applyCard(c, d) {
  const normCol = s => { if (!s) return null; const k = String(s).trim(); const cap = k.charAt(0).toUpperCase() + k.slice(1).toLowerCase(); return TEE[cap] ? cap : TEE_EN[k.toLowerCase()] || null; };
  if (d.name && (!c.name || c.name === 'Nouveau parcours')) c.name = d.name;
  delete c.draft; // les valeurs viennent maintenant de la vraie carte
  const H = (d.holes || []).filter(h => h && h.n >= 1 && h.n <= 18);
  if (H.length) {
    const N = Math.max(...H.map(h => h.n)) > 9 ? 18 : 9;
    if (c.holes.length !== N) { const old = c.holes; c.holes = blankHoles(N).map((h, i) => old[i] || h); }
    for (const h of H) {
      const t = c.holes[h.n - 1]; if (!t) continue;
      if (num(h.par)) t.par = num(h.par); if (num(h.hcp)) t.hcp = num(h.hcp);
      for (const [col, v] of Object.entries(h.dist || {})) { const cc = normCol(col); if (cc && num(v)) t.dist[cc] = Math.round(num(v)); }
    }
  }
  const tees = (d.tees || []).map(t => ({color: normCol(t.color), slope: num(t.slope), sss: num(t.sss), par: num(t.par)})).filter(t => t.color);
  const cols = new Set(tees.map(t => t.color)); c.holes.forEach(h => Object.keys(h.dist).forEach(k => cols.add(k)));
  const par = coursePar(c);
  c.tees = [...cols].map(col => { const t = tees.find(x => x.color === col) || c.tees.find(x => x.color === col) || {}; return {color: col, slope: t.slope || 113, sss: t.sss || par, par: t.par || par}; });
  // on retire les distances OSM provisoires des couleurs absentes de la carte
  c.holes.forEach(h => Object.keys(h.dist).forEach(k => { if (!cols.has(k)) delete h.dist[k]; }));
}

/* ---------- profil ---------- */
V.profile = () => {
  const p = S.profile;
  return `<section class="card"><h3>Joueur</h3>
    <label class="f">Nom<input value="${esc(p.name)}" onchange="G.pset('name',this.value)"></label>
    <div class="grid2"><label class="f">Index<input inputmode="decimal" value="${esc(p.index)}" onchange="G.pset('index',this.value)"></label>
    <label class="f">Départ habituel<select onchange="G.pset('tee',this.value)">${Object.keys(TEE).map(c => `<option ${c === p.tee ? 'selected' : ''}>${c}</option>`).join('')}</select></label></div></section>
  <section class="card"><h3>Mes clubs et distances (m)</h3><p class="mute">Distance totale moyenne d'un coup plein. Sert au conseil de club et au bilan.</p>
    ${p.clubs.map((c, k) => `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input value="${esc(c.name)}" onchange="G.clset(${k},'name',this.value)" style="flex:1"><input inputmode="numeric" value="${c.dist}" onchange="G.clset(${k},'dist',this.value)" style="width:80px;text-align:center"><button class="btn sm ghost" onclick="G.clrm(${k})" aria-label="Supprimer">×</button></div>`).join('')}
    <button class="btn sm ghost" onclick="G.cladd()">+ Ajouter un club</button></section>
  <section class="card"><h3>Invités enregistrés</h3>${S.guests.length ? S.guests.map(g => `<div class="item"><span><b>${esc(g.name)}</b> <small>index ${g.index}${g.driver ? ' · driver ' + g.driver + ' m' : ''}</small></span><button class="btn sm ghost" onclick="G.grm('${g.id}')">Retirer</button></div>`).join('') : '<p class="mute">Aucun invité.</p>'}
    <button class="btn sm ghost" onclick="G.newGuest()">+ Ajouter un invité</button></section>
  <section class="card"><h3>Lecture des cartes (API Claude)</h3><p class="mute">Clé créée sur console.anthropic.com. Elle reste sur ce téléphone.</p>
    <label class="f">Clé API<input type="password" autocomplete="off" value="${esc(p.apiKey)}" onchange="G.pset('apiKey',this.value.trim())" placeholder="sk-ant-..."></label>
    <label class="f">Modèle<input value="${esc(p.model)}" onchange="G.pset('model',this.value.trim())"></label></section>
  <section class="card"><h3>Test et sauvegarde</h3>
    <label class="row" style="margin-bottom:12px"><input type="checkbox" ${S.sim ? 'checked' : ''} onchange="G.sim(this.checked)" style="min-height:auto;width:22px;height:22px"> Mode simulation (toucher le schéma remplace le GPS)</label>
    <div class="grid2"><button class="btn ghost" onclick="G.exportData()">Exporter</button><button class="btn ghost" onclick="$f('#fImport')">Importer</button></div>
    <p class="mute" style="margin:8px 0 0">Les données sont stockées sur ce téléphone. Exporte régulièrement pour garder une copie.</p></section>`;
};
G.pset = (k, v) => { S.profile[k] = k === 'index' ? num(v, 54) : v; save.profile(); };
G.clset = (k, f, v) => { S.profile.clubs[k][f] = f === 'dist' ? (num(v, 0)) : v; save.profile(); };
G.clrm = k => { S.profile.clubs.splice(k, 1); save.profile(); render(); };
G.cladd = () => { S.profile.clubs.push({id: uid(), name: 'Club', dist: 100}); save.profile(); render(); };
G.grm = id => { S.guests = S.guests.filter(g => g.id !== id); save.guests(); render(); };
G.sim = on => { S.sim = on; if (on && !GPS.pos) { const c = S.courses.find(c => c.holes[0].tee); if (c) GPS.pos = {...c.holes[0].tee, acc: 4, t: Date.now()}; } gpsBadge(); toast(on ? 'Simulation active : touche le schéma pendant une partie' : 'GPS réel'); };
G.exportData = async () => {
  const photos = {};
  for (const c of S.courses) for (const h of c.holes) if (h.photo) photos[h.photo] = await photoData(h.photo);
  const blob = new Blob([JSON.stringify({v: 1, profile: S.profile, guests: S.guests, courses: S.courses, rounds: S.rounds, photos})], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'caddie-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
};
G.importData = async input => {
  const f = input.files[0]; input.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    S.profile = d.profile; S.guests = d.guests || []; S.courses = d.courses || []; S.rounds = d.rounds || [];
    for (const [k, v] of Object.entries(d.photos || {})) await Store.set('ph:' + k, v);
    await Promise.all([save.profile(), save.guests(), save.courses(), save.rounds()]); toast('Sauvegarde importée'); render();
  } catch (e) { toast('Fichier invalide'); }
};

/* ---------- demarrage ---------- */
(async () => {
  await Store.open();
  S.profile = await Store.get('profile') || defaultProfile();
  S.guests = await Store.get('guests') || [];
  S.courses = await Store.get('courses') || [];
  S.rounds = await Store.get('rounds') || [];
  if (!await Store.get('profile')) save.profile();
  S.view = liveRound() ? 'play' : 'home';
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
}
</script>
</body>
